<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#25282b" />
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>"
  />
  <title>SCREEN SAVER</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      min-height: 240px;
      margin: 0;
      overflow: hidden;
      cursor: none;
      background: #000;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #fox {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(57px, 12.1vmin, 123px);
      height: clamp(57px, 12.1vmin, 123px);
      display: grid;
      place-items: center;
      font-size: clamp(48px, 9.9vmin, 103px);
      line-height: 1;
      user-select: none;
      pointer-events: none;
      will-change: transform;
    }

    #fox.hidden {
      display: none;
    }

    #hacked-warning {
      position: fixed;
      top: clamp(12px, 3vh, 30px);
      left: 50%;
      z-index: 500;
      display: none;
      width: 100%;
      padding: 0 16px;
      color: #ff0000;
      font-size: clamp(1.1rem, 3.5vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      text-shadow:
        0 0 5px #ff0000,
        0 0 14px #ff0000,
        0 0 28px #9c0000;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }

    #hacked-warning.visible {
      display: block;
      animation: warning-flicker 0.35s infinite alternate;
    }

    @keyframes warning-flicker {
      from {
        opacity: 1;
        filter: brightness(1);
      }

      to {
        opacity: 0.4;
        filter: brightness(1.8);
      }
    }

    /* Main GIF: HACKIMAGE.gif */
    #scare-image {
      position: fixed;
      z-index: 100;
      display: none;
      width: clamp(150px, 30vw, 430px);
      max-width: 70vw;
      max-height: 70vh;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      filter: contrast(1.2) saturate(1.25);
      will-change: left, top, opacity;
    }

    #scare-image.showing {
      display: block;
    }

    /* Still and centered during the intro and ending. */
    #scare-image.centered {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* Smaller GIFs: INFECTED1.gif through INFECTED5.gif */
    .infected-image {
      position: fixed;
      z-index: 90;
      display: none;
      width: clamp(55px, 10vw, 145px);
      max-width: 24vw;
      max-height: 24vh;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      opacity: 0.95;
      filter: contrast(1.3) saturate(1.4);
      will-change: left, top, opacity;
    }

    .infected-image.showing {
      display: block;
    }

    /* Brief, independent flashes during the bouncing section. */
    .showing.flashing {
      opacity: 0;
    }

    #closing-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      background: #000;
      color: #ff2020;
      font-size: clamp(1rem, 3vw, 2rem);
      letter-spacing: 0.25em;
      text-align: center;
      text-shadow: 0 0 12px #f00;
    }

    #closing-screen.visible {
      display: grid;
    }
  </style>
</head>

<body>
  <div id="hacked-warning" aria-hidden="true">
    YOUR SYSTEM IS HACKED
  </div>

  <main id="stage" aria-label="A fox emoji bouncing around the screen">
    <div id="fox" role="img" aria-label="fox">🦊</div>
  </main>

  <img id="scare-image" src="HACKIMAGE.gif" alt="" aria-hidden="true" />

  <img class="infected-image" src="INFECTED1.gif" alt="" aria-hidden="true" />
  <img class="infected-image" src="INFECTED2.gif" alt="" aria-hidden="true" />
  <img class="infected-image" src="INFECTED3.gif" alt="" aria-hidden="true" />
  <img class="infected-image" src="INFECTED4.gif" alt="" aria-hidden="true" />
  <img class="infected-image" src="INFECTED5.gif" alt="" aria-hidden="true" />

  <audio id="scare-audio" preload="auto">
    <source src="SCARESONGBACKGROUND.mp3" type="audio/mpeg" />
  </audio>

  <div id="closing-screen" aria-live="polite">
    SESSION ENDED
  </div>

  <script>
    (() => {
      const stage = document.getElementById("stage");
      const fox = document.getElementById("fox");
      const hackedWarning = document.getElementById("hacked-warning");
      const scareImage = document.getElementById("scare-image");
      const infectedImages = [
        ...document.querySelectorAll(".infected-image")
      ];
      const scareAudio = document.getElementById("scare-audio");
      const closingScreen = document.getElementById("closing-screen");

      const INTRO_MS = 3000;
      const OUTRO_START_SECONDS = 64;
      const FOX_SPEED = 230;

      let foxX = 24;
      let foxY = 24;
      let foxVx = FOX_SPEED;
      let foxVy = FOX_SPEED * 0.72;
      let lastFrame = performance.now();

      let phase = "idle";
      let introTimeoutId = null;
      let audioFallbackTimeoutId = null;

      const bouncingImages = [scareImage, ...infectedImages];
      const movingImages = [];

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function imageLimits(image) {
        return {
          maxX: Math.max(0, window.innerWidth - image.offsetWidth),
          maxY: Math.max(0, window.innerHeight - image.offsetHeight)
        };
      }

      function chooseNewMotion(item) {
        const angle = randomBetween(0, Math.PI * 2);
        const speed = randomBetween(
          item.image === scareImage ? 130 : 95,
          item.image === scareImage ? 370 : 340
        );

        item.vx = Math.cos(angle) * speed;
        item.vy = Math.sin(angle) * speed;
      }

      function placeMovingImage(image) {
        const limits = imageLimits(image);

        const item = {
          image,
          x: Math.random() * limits.maxX,
          y: Math.random() * limits.maxY,
          vx: 0,
          vy: 0,
          nextChange: performance.now() + randomBetween(350, 1800),
          flashUntil: 0
        };

        chooseNewMotion(item);
        movingImages.push(item);

        image.style.left = `${item.x}px`;
        image.style.top = `${item.y}px`;
      }

      function moveWithinBounds(item, dt, now) {
        const limits = imageLimits(item.image);

        if (now >= item.nextChange) {
          /*
            Each GIF independently changes direction and speed.
            Sometimes it teleports or briefly flashes out.
          */
          chooseNewMotion(item);

          if (Math.random() < 0.28) {
            item.x = Math.random() * limits.maxX;
            item.y = Math.random() * limits.maxY;
          }

          if (Math.random() < 0.34) {
            item.flashUntil = now + randomBetween(80, 320);
          }

          item.nextChange = now + randomBetween(350, 1800);
        }

        item.x += item.vx * dt;
        item.y += item.vy * dt;

        if (item.x < 0 || item.x > limits.maxX) {
          item.x = clamp(item.x, 0, limits.maxX);
          item.vx = -item.vx;
        }

        if (item.y < 0 || item.y > limits.maxY) {
          item.y = clamp(item.y, 0, limits.maxY);
          item.vy = -item.vy;
        }

        item.image.style.left = `${item.x}px`;
        item.image.style.top = `${item.y}px`;
        item.image.classList.toggle("flashing", now < item.flashUntil);
      }

      function frame(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;

        if (phase === "idle") {
          const maxX = Math.max(0, stage.clientWidth - fox.offsetWidth);
          const maxY = Math.max(0, stage.clientHeight - fox.offsetHeight);

          foxX += foxVx * dt;
          foxY += foxVy * dt;

          if (foxX < 0 || foxX > maxX) {
            foxX = clamp(foxX, 0, maxX);
            foxVx = -foxVx;
          }

          if (foxY < 0 || foxY > maxY) {
            foxY = clamp(foxY, 0, maxY);
            foxVy = -foxVy;
          }

          fox.style.transform =
            `translate3d(${foxX}px, ${foxY}px, 0)`;
        } else if (phase === "bouncing") {
          movingImages.forEach((item) => {
            moveWithinBounds(item, dt, now);
          });
        }

        requestAnimationFrame(frame);
      }

      function startBouncing() {
        if (phase !== "intro") {
          return;
        }

        phase = "bouncing";
        scareImage.classList.remove("centered");

        movingImages.length = 0;

        bouncingImages.forEach((image) => {
          image.classList.add("showing");
          placeMovingImage(image);
        });
      }

      function startOutro() {
        if (phase === "outro" || phase === "ended") {
          return;
        }

        phase = "outro";
        clearTimeout(introTimeoutId);

        hackedWarning.classList.remove("visible");

        infectedImages.forEach((image) => {
          image.classList.remove("showing", "flashing");
        });

        scareImage.classList.remove("flashing");
        scareImage.style.left = "";
        scareImage.style.top = "";
        scareImage.classList.add("showing", "centered");

        movingImages.length = 0;
      }

      function endScareSequence() {
        if (phase === "ended" || phase === "idle") {
          return;
        }

        phase = "ended";
        clearTimeout(introTimeoutId);
        clearTimeout(audioFallbackTimeoutId);

        scareImage.classList.remove("showing", "centered", "flashing");

        infectedImages.forEach((image) => {
          image.classList.remove("showing", "flashing");
        });

        hackedWarning.classList.remove("visible");
        scareAudio.pause();
        closingScreen.classList.add("visible");

        setTimeout(() => {
          window.close();

          /* Fallback when the browser does not allow the tab to close. */
          document.body.innerHTML = "";
          document.body.style.background = "#000";
        }, 2000);
      }

      function startScareSequence() {
        if (phase !== "idle") {
          return;
        }

        phase = "intro";
        fox.classList.add("hidden");
        hackedWarning.classList.add("visible");
        scareImage.classList.add("showing", "centered");

        scareAudio.currentTime = 0;
        introTimeoutId = setTimeout(startBouncing, INTRO_MS);

        scareAudio.play().catch(() => {
          /*
            If the audio cannot play, keep the original
            67-second total duration as a fallback.
          */
          audioFallbackTimeoutId = setTimeout(() => {
            startOutro();
            endScareSequence();
          }, 67000);
        });
      }

      scareAudio.addEventListener("timeupdate", () => {
        if (
          phase !== "idle" &&
          phase !== "ended" &&
          scareAudio.currentTime >= OUTRO_START_SECONDS
        ) {
          startOutro();
        }
      });

      scareAudio.addEventListener("ended", endScareSequence);

      addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "q") {
          startScareSequence();
        }
      });

      addEventListener("resize", () => {
        if (phase === "idle") {
          foxX = clamp(
            foxX,
            0,
            Math.max(0, stage.clientWidth - fox.offsetWidth)
          );
          foxY = clamp(
            foxY,
            0,
            Math.max(0, stage.clientHeight - fox.offsetHeight)
          );
        }

        movingImages.forEach((item) => {
          const limits = imageLimits(item.image);
          item.x = clamp(item.x, 0, limits.maxX);
          item.y = clamp(item.y, 0, limits.maxY);
        });
      });

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
